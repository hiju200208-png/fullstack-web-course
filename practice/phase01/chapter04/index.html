<!DOCTYPE html>
<html lang="ko">

    <title>Member Management</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- 4장 실습을 위한 header 태그 추가 -->
    <header>
        <h1>Member Management</h1> <!-- 7장 우선순위 테스트용 p 태그 추가 -->
        <p id="important" class="notice">중요 안내: 시스템 점검이 있습니다.</p>
    </header>

    <!-- 3.2 클래스 선택자 실습 영역 -->

        <h2>홍길동 회원</h2>
        <p>이메일: gildong@example.com</p>

    <!-- 3.3 아이디 선택자 실습 영역 -->
    <form id="signup-form">
        <h3>회원가입 폼</h3>
        <p>아이디와 비밀번호를 입력해주세요.</p>
    </form>
